<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カウンター &amp; 金額計算アプリ</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --secondary: #64748b;
      --secondary-hover: #475569;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-sub);
      letter-spacing: 0.05em;
    }

    /* 現在の集計名表示バー */
    .tally-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 12px;
    }

    .tally-label {
      font-size: 0.875rem;
      color: var(--text-sub);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }

    .tally-label strong {
      color: var(--text-main);
      font-size: 1rem;
      margin-left: 4px;
    }

    .secondary-btn-sm {
      padding: 6px 12px;
      font-size: 0.8125rem;
      font-weight: 600;
      background-color: var(--secondary);
      color: var(--text-main);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .secondary-btn-sm:active {
      background-color: var(--secondary-hover);
    }

    /* カウント数表示エリア */
    .count-display {
      text-align: center;
      padding: 12px 0;
    }

    .count-number {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
    }

    .count-label {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* 単価設定エリア */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    .price-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .price-input-wrapper input {
      width: 100%;
      padding: 14px 40px 14px 16px;
      background-color: rgba(15, 23, 42, 0.6);
      border: 2px solid #334155;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1.125rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .price-input-wrapper input:focus {
      border-color: var(--primary);
    }

    .price-input-wrapper .unit {
      position: absolute;
      right: 16px;
      color: var(--text-sub);
      font-weight: 600;
      pointer-events: none;
    }

    /* 合計金額表示エリア */
    .total-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.15));
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
    }

    .total-label {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .total-amount {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ボタンエリア */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .primary-btn {
      width: 100%;
      padding: 18px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      background-color: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      transition: background-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .primary-btn:active {
      transform: scale(0.98);
      background-color: var(--primary-hover);
    }

    .sub-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 14px 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .secondary-btn {
      background-color: var(--secondary);
      color: var(--text-main);
    }

    .secondary-btn:active {
      background-color: var(--secondary-hover);
    }

    .share-btn {
      background-color: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .share-btn:active {
      background-color: var(--primary);
      color: #ffffff;
    }

    .danger-btn {
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .danger-btn:active {
      background-color: var(--danger);
      color: #ffffff;
    }

    /* モーダル共通スタイル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    .close-btn:hover { color: var(--text-main); }

    .qr-wrapper {
      display: flex;
      justify-content: center;
      padding: 16px;
      background-color: #ffffff;
      border-radius: 16px;
    }

    .qr-wrapper canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .share-url-box {
      display: flex;
      gap: 8px;
    }

    .share-url-box input {
      flex: 1;
      padding: 10px 12px;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 0.875rem;
      outline: none;
    }

    .primary-btn-sm {
      padding: 10px 16px;
      font-size: 0.875rem;
      font-weight: 600;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toast-msg {
      text-align: center;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* 集計切替モーダルスタイル */
    .tally-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .tally-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--text-main);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .tally-item:hover {
      border-color: var(--primary);
    }

    .tally-item.active {
      background-color: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }

    .tally-item-name {
      flex: 1;
    }

    .tally-delete-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>カウンター &amp; 単価計算</h1>

    <!-- 集計名表示バー -->
    <div class="tally-bar">
      <div class="tally-label">集計: <strong id="tallyNameDisplay">デフォルト</strong></div>
      <button type="button" class="secondary-btn-sm" id="btnOpenSwitchModal">切替</button>
    </div>

    <!-- カウント表示 -->
    <div class="count-display">
      <div class="count-number" id="countVal">0</div>
      <div class="count-label">現在のカウント</div>
    </div>

    <!-- 単価設定 -->
    <div class="input-group">
      <label for="priceInput">単価設定</label>
      <div class="price-input-wrapper">
        <input type="number" id="priceInput" min="0" placeholder="0" value="100">
        <span class="unit">円</span>
      </div>
    </div>

    <!-- 合計金額表示 -->
    <div class="total-card">
      <div class="total-label">合計金額</div>
      <div class="total-amount" id="totalAmount">0 円</div>
    </div>

    <!-- 操作ボタン -->
    <div class="button-group">
      <button type="button" class="primary-btn" id="btnPlus">+ 1</button>
      <div class="sub-buttons">
        <button type="button" class="btn secondary-btn" id="btnMinus">1つ戻す</button>
        <button type="button" class="btn share-btn" id="btnShare">共有</button>
        <button type="button" class="btn secondary-btn" id="btnSync">同期</button>
        <button type="button" class="btn danger-btn" id="btnReset">リセット</button>
      </div>
    </div>
  </div>

  <!-- 集計切替モーダル -->
  <div class="modal-overlay" id="switchModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>集計の切替・新規作成</h2>
        <button type="button" class="close-btn" id="btnCloseSwitchModal">&times;</button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="font-size: 0.875rem; color: var(--text-sub); display: block; margin-bottom: 8px;">集計一覧</label>
          <div class="tally-list" id="tallyList"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label for="newTallyInput" style="font-size: 0.875rem; color: var(--text-sub);">新しい集計名</label>
          <input type="text" id="newTallyInput" placeholder="例: わなげ" maxlength="12" style="padding: 10px 12px; background-color: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 8px; color: var(--text-main); outline: none;">
          <label for="newTallyPasswordInput" style="font-size: 0.875rem; color: var(--text-sub);">パスワード（切替のたびに必要）</label>
          <div style="display: flex; gap: 8px;">
            <input type="password" id="newTallyPasswordInput" placeholder="パスワードを設定" style="flex: 1; padding: 10px 12px; background-color: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 8px; color: var(--text-main); outline: none;">
            <button type="button" class="primary-btn-sm" id="btnCreateTally">作成して切替</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 共有モーダル -->
  <div class="modal-overlay" id="shareModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>状態の共有 (QRコード)</h2>
        <button type="button" class="close-btn" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="qr-wrapper">
          <canvas id="qrCanvas"></canvas>
        </div>
        <div class="share-url-box">
          <input type="text" id="shareUrlInput" readonly>
          <button type="button" class="primary-btn-sm" id="btnCopy">コピー</button>
        </div>
        <div class="toast-msg" id="toastMsg" style="display: none;">URLをコピーしました！</div>
      </div>
    </div>
  </div>

  <!-- 同期モーダル -->
  <div class="modal-overlay" id="syncModal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>サーバーとの同期</h2>
        <button type="button" class="close-btn" id="btnCloseSyncModal">&times;</button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="font-size: 0.9375rem; color: var(--text-sub); line-height: 1.6;">
          サーバー上の集計「<strong id="syncTallyName" style="color: var(--text-main);"></strong>」<br>
          カウント: <strong id="syncServerCount" style="color: var(--text-main);"></strong> /
          単価: <strong id="syncServerPrice" style="color: var(--text-main);"></strong>円
        </div>
        <button type="button" class="primary-btn" id="btnSyncPull" style="font-size: 1.125rem; padding: 14px;">サーバーの内容を取り込む</button>
        <button type="button" class="btn secondary-btn" id="btnSyncPush">この端末の内容をサーバーへ送信する</button>
      </div>
    </div>
  </div>

  <script>
    // --- 完全自己完結 バニラJS QRコード生成エンジン (変更なし) ---
    const QRCodeGenerator = (function() {
      var QRMath = {
        glog: function(n) { if (n < 1) throw new Error("glog"); return QRMath.LOG_TABLE[n]; },
        gexp: function(n) { while (n < 0) n += 255; while (n >= 256) n -= 255; return QRMath.EXP_TABLE[n]; },
        EXP_TABLE: new Array(256), LOG_TABLE: new Array(256)
      };
      for (var i = 0; i < 8; i++) QRMath.EXP_TABLE[i] = 1 << i;
      for (var i = 8; i < 256; i++) QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4] ^ QRMath.EXP_TABLE[i - 5] ^ QRMath.EXP_TABLE[i - 6] ^ QRMath.EXP_TABLE[i - 8];
      for (var i = 0; i < 255; i++) QRMath.LOG_TABLE[QRMath.EXP_TABLE[i]] = i;

      var G15 = 0x537, G15_MASK = 0x5412;
      function getBCHDigit(data) { var digit = 0; while (data != 0) { digit++; data >>>= 1; } return digit; }
      function getBCHTypeInfo(data) {
        var d = data << 10;
        while (getBCHDigit(d) - getBCHDigit(G15) >= 0) d ^= (G15 << (getBCHDigit(d) - getBCHDigit(G15)));
        return ((data << 10) | d) ^ G15_MASK;
      }
      function applyMask0(row, col, dark) { return (row + col) % 2 == 0 ? !dark : dark; }

      // バージョン情報(バージョン7以上で必須)のBCH(18,6)符号化
      var G18 = 0x1F25;
      function getBCHTypeNumber(typeNumber) {
        var d = typeNumber << 12;
        while (getBCHDigit(d) - getBCHDigit(G18) >= 0) d ^= (G18 << (getBCHDigit(d) - getBCHDigit(G18)));
        return (typeNumber << 12) | d;
      }

      function QRPolynomial(num, shift) {
        var offset = 0;
        while (offset < num.length && num[offset] == 0) offset++;
        this.num = new Array(num.length - offset + shift);
        for (var i = 0; i < num.length - offset; i++) this.num[i] = num[i + offset];
      }
      QRPolynomial.prototype = {
        get: function(i) { return this.num[i]; },
        getLength: function() { return this.num.length; },
        multiply: function(e) {
          var num = new Array(this.getLength() + e.getLength() - 1);
          for (var i = 0; i < this.getLength(); i++) {
            for (var j = 0; j < e.getLength(); j++) {
              num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i)) + QRMath.glog(e.get(j)));
            }
          }
          return new QRPolynomial(num, 0);
        },
        mod: function(e) {
          if (this.getLength() - e.getLength() < 0) return this;
          var ratio = QRMath.glog(this.get(0)) - QRMath.glog(e.get(0));
          var num = new Array(this.getLength());
          for (var i = 0; i < this.getLength(); i++) num[i] = this.get(i);
          for (var i = 0; i < e.getLength(); i++) num[i] ^= QRMath.gexp(QRMath.glog(e.get(i)) + ratio);
          return new QRPolynomial(num, 0).mod(e);
        }
      };

      var PATTERN_POSITION_TABLE = [
        [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
      ];

      function RSBlock(totalCount, dataCount) { this.totalCount = totalCount; this.dataCount = dataCount; }
      RSBlock.RS_BLOCK_TABLE = [
        [1, 26, 19], [1, 26, 16], [1, 26, 13], [1, 26, 9],
        [1, 44, 34], [1, 44, 28], [1, 44, 22], [1, 44, 16],
        [1, 70, 55], [1, 70, 44], [2, 35, 17], [2, 35, 13],
        [1, 100, 80], [2, 50, 32], [2, 50, 24], [4, 25, 9],
        [1, 134, 108], [2, 67, 43], [2, 33, 15, 2, 34, 16], [2, 33, 11, 2, 34, 12],
        [2, 86, 68], [4, 43, 27], [4, 43, 19], [4, 43, 15],
        [2, 98, 78], [4, 49, 31], [2, 32, 14, 4, 33, 15], [4, 39, 13, 1, 40, 14],
        [2, 121, 97], [2, 60, 38, 2, 61, 39], [4, 40, 18, 2, 41, 19], [4, 40, 14, 2, 41, 15],
        [2, 146, 116], [3, 58, 36, 2, 59, 37], [4, 36, 16, 4, 37, 17], [4, 36, 12, 4, 37, 13],
        [2, 86, 68, 2, 87, 69], [4, 69, 43, 1, 70, 44], [6, 43, 19, 2, 44, 20], [6, 43, 15, 2, 44, 16]
      ];
      RSBlock.getRSBlocks = function(typeNumber, ecl) {
        var rsBlock = RSBlock.getRsBlockTable(typeNumber, ecl);
        var list = [];
        for (var i = 0; i < rsBlock.length; i += 3) {
          for (var j = 0; j < rsBlock[i]; j++) list.push(new RSBlock(rsBlock[i + 1], rsBlock[i + 2]));
        }
        return list;
      };
      RSBlock.getRsBlockTable = function(typeNumber, ecl) {
        var idx = (typeNumber - 1) * 4 + (ecl == 'M' ? 1 : ecl == 'Q' ? 2 : ecl == 'H' ? 3 : 0);
        return RSBlock.RS_BLOCK_TABLE[idx];
      };

      function BitBuffer() { this.buffer = []; this.length = 0; }
      BitBuffer.prototype = {
        put: function(num, length) { for (var i = 0; i < length; i++) this.putBit(((num >>> (length - i - 1)) & 1) == 1); },
        putBit: function(bit) {
          var bufIndex = Math.floor(this.length / 8);
          if (this.buffer.length <= bufIndex) this.buffer.push(0);
          if (bit) this.buffer[bufIndex] |= (0x80 >>> (this.length % 8));
          this.length++;
        }
      };

      function QRCodeModel(typeNumber, ecl) {
        this.typeNumber = typeNumber; this.ecl = ecl;
        this.modules = null; this.moduleCount = 0; this.dataList = [];
      }
      QRCodeModel.prototype = {
        addData: function(data) {
          this.dataList.push({
            data: data,
            getLength: function() { return encodeURI(data).replace(/%../g, 'i').length; },
            write: function(buffer) {
              for (var i = 0; i < data.length; i++) {
                var c = data.charCodeAt(i);
                if (c < 0x80) buffer.put(c, 8);
                else if (c < 0x800) { buffer.put(0xc0 | (c >> 6), 8); buffer.put(0x80 | (c & 0x3f), 8); }
                else { buffer.put(0xe0 | (c >> 12), 8); buffer.put(0x80 | ((c >> 6) & 0x3f), 8); buffer.put(0x80 | (c & 0x3f), 8); }
              }
            }
          });
        },
        make: function() {
          var typeNumber = 1;
          for (typeNumber = 1; typeNumber <= 10; typeNumber++) {
            var rsBlocks = RSBlock.getRSBlocks(typeNumber, this.ecl);
            var buffer = new BitBuffer();
            var totalDataCount = 0;
            for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
            for (var i = 0; i < this.dataList.length; i++) {
              var data = this.dataList[i];
              buffer.put(4, 4);
              buffer.put(data.getLength(), typeNumber < 10 ? 8 : 16);
              data.write(buffer);
            }
            if (buffer.length <= totalDataCount * 8) break;
          }
          this.typeNumber = typeNumber;
          this.makeImpl(false, 0);
        },
        makeImpl: function(test, maskPattern) {
          this.moduleCount = this.typeNumber * 4 + 17;
          this.modules = new Array(this.moduleCount);
          for (var r = 0; r < this.moduleCount; r++) {
            this.modules[r] = new Array(this.moduleCount);
            for (var c = 0; c < this.moduleCount; c++) this.modules[r][c] = null;
          }
          this.setupPositionProbePattern(0, 0);
          this.setupPositionProbePattern(this.moduleCount - 7, 0);
          this.setupPositionProbePattern(0, this.moduleCount - 7);
          this.setupPositionAdjustPattern();
          this.setupTimingPattern();
          if (this.typeNumber >= 7) this.setupTypeNumber(test);
          this.setupTypeInfo(test, maskPattern);
          var dataCache = QRCodeModel.createData(this.typeNumber, this.ecl, this.dataList);
          this.mapData(dataCache, maskPattern);
        },
        setupTypeNumber: function(test) {
          var bits = getBCHTypeNumber(this.typeNumber);
          for (var i = 0; i < 18; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
          }
          for (var i = 0; i < 18; i++) {
            var mod = (!test && ((bits >> i) & 1) == 1);
            this.modules[i % 3 + this.moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        },
        setupPositionProbePattern: function(r, c) {
          for (var row = -1; row <= 7; row++) {
            if (r + row <= -1 || this.moduleCount <= r + row) continue;
            for (var col = -1; col <= 7; col++) {
              if (c + col <= -1 || this.moduleCount <= c + col) continue;
              this.modules[r + row][c + col] = ((0 <= row && row <= 6 && (col == 0 || col == 6)) ||
                (0 <= col && col <= 6 && (row == 0 || row == 6)) ||
                (2 <= row && row <= 4 && 2 <= col && col <= 4));
            }
          }
        },
        setupPositionAdjustPattern: function() {
          var pos = PATTERN_POSITION_TABLE[this.typeNumber - 1];
          for (var i = 0; i < pos.length; i++) {
            for (var j = 0; j < pos.length; j++) {
              var row = pos[i], col = pos[j];
              if (this.modules[row][col] != null) continue;
              for (var r = -2; r <= 2; r++) {
                for (var c = -2; c <= 2; c++) {
                  this.modules[row + r][col + c] = (r == -2 || r == 2 || c == -2 || c == 2 || (r == 0 && c == 0));
                }
              }
            }
          }
        },
        setupTimingPattern: function() {
          for (var r = 8; r < this.moduleCount - 8; r++) if (this.modules[r][6] == null) this.modules[r][6] = (r % 2 == 0);
          for (var c = 8; c < this.moduleCount - 8; c++) if (this.modules[6][c] == null) this.modules[6][c] = (c % 2 == 0);
        },
        setupTypeInfo: function(test, maskPattern) {
          var data = getBCHTypeInfo((0 << 3) | maskPattern);
          for (var i = 0; i < 15; i++) {
            var mod = (!test && ((data >> i) & 1) == 1);
            if (i < 6) this.modules[i][8] = mod;
            else if (i < 8) this.modules[i + 1][8] = mod;
            else this.modules[this.moduleCount - 15 + i][8] = mod;

            if (i < 8) this.modules[8][this.moduleCount - i - 1] = mod;
            else if (i < 9) this.modules[8][15 - i - 1 + 1] = mod;
            else this.modules[8][15 - i - 1] = mod;
          }
          this.modules[this.moduleCount - 8][8] = (!test);
        },
        mapData: function(data, maskPattern) {
          var inc = -1, row = this.moduleCount - 1, bitIndex = 7, byteIndex = 0;
          for (var col = this.moduleCount - 1; col > 0; col -= 2) {
            if (col == 6) col--;
            while (true) {
              for (var c = 0; c < 2; c++) {
                if (this.modules[row][col - c] == null) {
                  var dark = false;
                  if (byteIndex < data.length) dark = (((data[byteIndex] >>> bitIndex) & 1) == 1);
                  this.modules[row][col - c] = applyMask0(row, col - c, dark);
                  bitIndex--;
                  if (bitIndex == -1) { byteIndex++; bitIndex = 7; }
                }
              }
              row += inc;
              if (row < 0 || this.moduleCount <= row) { row -= inc; inc = -inc; break; }
            }
          }
        }
      };

      QRCodeModel.createData = function(typeNumber, ecl, dataList) {
        var rsBlocks = RSBlock.getRSBlocks(typeNumber, ecl);
        var buffer = new BitBuffer();
        for (var i = 0; i < dataList.length; i++) {
          var data = dataList[i];
          buffer.put(4, 4);
          buffer.put(data.getLength(), typeNumber < 10 ? 8 : 16);
          data.write(buffer);
        }
        var totalDataCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;
        if (buffer.length + 4 <= totalDataCount * 8) buffer.put(0, 4);
        while (buffer.length % 8 != 0) buffer.putBit(false);
        while (true) {
          if (buffer.length >= totalDataCount * 8) break;
          buffer.put(0xec, 8);
          if (buffer.length >= totalDataCount * 8) break;
          buffer.put(0x11, 8);
        }
        return QRCodeModel.createBytes(buffer, rsBlocks);
      };

      QRCodeModel.createBytes = function(buffer, rsBlocks) {
        var offset = 0, maxDcCount = 0, maxEcCount = 0;
        var dcdata = new Array(rsBlocks.length), ecdata = new Array(rsBlocks.length);
        for (var r = 0; r < rsBlocks.length; r++) {
          var dcCount = rsBlocks[r].dataCount;
          var ecCount = rsBlocks[r].totalCount - dcCount;
          maxDcCount = Math.max(maxDcCount, dcCount);
          maxEcCount = Math.max(maxEcCount, ecCount);
          dcdata[r] = new Array(dcCount);
          for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
          offset += dcCount;
          var rsPoly = (function(len) {
            var a = new QRPolynomial([1], 0);
            for (var i = 0; i < len; i++) a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0));
            return a;
          })(ecCount);
          var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
          var modPoly = rawPoly.mod(rsPoly);
          ecdata[r] = new Array(rsPoly.getLength() - 1);
          for (var i = 0; i < ecdata[r].length; i++) {
            var modIndex = i + modPoly.getLength() - ecdata[r].length;
            ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0;
          }
        }
        var totalCodeCount = 0;
        for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;
        var data = new Array(totalCodeCount), index = 0;
        for (var i = 0; i < maxDcCount; i++) for (var r = 0; r < rsBlocks.length; r++) if (i < dcdata[r].length) data[index++] = dcdata[r][i];
        for (var i = 0; i < maxEcCount; i++) for (var r = 0; r < rsBlocks.length; r++) if (i < ecdata[r].length) data[index++] = ecdata[r][i];
        return data;
      };

      return {
        draw: function(text, canvas, cellSize) {
          cellSize = cellSize || 5;
          var qr = new QRCodeModel(0, 'M');
          qr.addData(text);
          qr.make();
          var count = qr.moduleCount;
          var margin = cellSize * 4;
          canvas.width = count * cellSize + margin * 2;
          canvas.height = count * cellSize + margin * 2;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#0f172a';
          for (var r = 0; r < count; r++) {
            for (var c = 0; c < count; c++) {
              if (qr.modules[r][c]) {
                ctx.fillRect(margin + c * cellSize, margin + r * cellSize, cellSize, cellSize);
              }
            }
          }
        }
      };
    })();

    // --- ストレージキー定数 ---
    const KEY_NAMES = 'counterTallyNames';
    const KEY_ACTIVE = 'counterTallyActiveName';
    const KEY_STATE_PREFIX = 'counterTallyState:';
    const KEY_PASSWORD_PREFIX = 'counterTallyPassword:';
    const OLD_KEY = 'counterAppState';

    // --- 移行処理とストレージアクセサー ---
    function migrateAndInitData() {
      const rawNames = localStorage.getItem(KEY_NAMES);
      if (rawNames === null) {
        // 旧キーからのデータ移行、または完全初期データ構築
        let initialCount = 0;
        let initialUnitPrice = 100;
        try {
          const oldData = JSON.parse(localStorage.getItem(OLD_KEY));
          if (oldData) {
            if (Number.isFinite(oldData.count) && oldData.count >= 0) initialCount = oldData.count;
            if (Number.isFinite(oldData.unitPrice) && oldData.unitPrice >= 0) initialUnitPrice = oldData.unitPrice;
          }
        } catch {}

        localStorage.setItem(KEY_NAMES, JSON.stringify(['デフォルト']));
        localStorage.setItem(KEY_ACTIVE, 'デフォルト');
        localStorage.setItem(KEY_STATE_PREFIX + 'デフォルト', JSON.stringify({ count: initialCount, unitPrice: initialUnitPrice }));
      }
    }

    function getTallyNames() {
      try {
        const names = JSON.parse(localStorage.getItem(KEY_NAMES));
        return Array.isArray(names) && names.length > 0 ? names : ['デフォルト'];
      } catch {
        return ['デフォルト'];
      }
    }

    function setTallyNames(names) {
      localStorage.setItem(KEY_NAMES, JSON.stringify(names));
    }

    function getActiveName() {
      return localStorage.getItem(KEY_ACTIVE) || 'デフォルト';
    }

    function setActiveName(name) {
      localStorage.setItem(KEY_ACTIVE, name);
    }

    // パスワード未設定(初回移行分など)はnullを返す。切替時はnullなら無条件で通す
    function getTallyPassword(name) {
      return localStorage.getItem(KEY_PASSWORD_PREFIX + name);
    }

    function setTallyPassword(name, password) {
      localStorage.setItem(KEY_PASSWORD_PREFIX + name, password);
    }

    function getTallyState(name) {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY_STATE_PREFIX + name));
        return {
          count: Number.isFinite(saved?.count) && saved.count >= 0 ? saved.count : 0,
          unitPrice: Number.isFinite(saved?.unitPrice) && saved.unitPrice >= 0 ? saved.unitPrice : 100,
        };
      } catch {
        return { count: 0, unitPrice: 100 };
      }
    }

    function setTallyState(name, state) {
      localStorage.setItem(KEY_STATE_PREFIX + name, JSON.stringify(state));
    }

    // --- URLクエリパラメータ解析 & 復元 ---
    function restoreFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const nameParam = params.get('n');
      const cParam = params.get('c');
      const pParam = params.get('p');

      let restoredName = null;
      let cVal = null;
      let pVal = null;
      let hasUrlParams = false;

      if (nameParam !== null && nameParam.trim() !== '') {
        restoredName = nameParam.trim();
        hasUrlParams = true;
      }

      if (cParam !== null) {
        const numC = Number(cParam);
        if (!isNaN(numC) && Number.isInteger(numC) && numC >= 0) {
          cVal = numC;
          hasUrlParams = true;
        }
      }

      if (pParam !== null) {
        const numP = Number(pParam);
        if (!isNaN(numP) && numP >= 0) {
          pVal = numP;
          hasUrlParams = true;
        }
      }

      // パラメータが存在した場合、URLをクリーンアップ
      if (nameParam !== null || cParam !== null || pParam !== null) {
        const cleanUrl = window.location.origin + window.location.pathname + window.location.hash;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      return hasUrlParams ? { name: restoredName, count: cVal, unitPrice: pVal } : null;
    }

    // パスワードを簡易ハッシュ化(16進文字列)。QR/URLには平文パスワードを含めないため
    function hashPassword(password) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < password.length; i++) {
        const c = password.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
    }

    // サーバー(DB)へチームのパスワードを照合する。パスワード未設定のチームは入力なしでそのまま通る
    async function fetchTeamFromServer(name, passwordHash) {
      try {
        const resp = await fetch(`/api/sync?name=${encodeURIComponent(name)}&passwordHash=${encodeURIComponent(passwordHash || '')}`);
        if (resp.status === 404) return { status: 'notfound' };
        if (resp.status === 403) return { status: 'forbidden' };
        if (!resp.ok) return { status: 'error' };
        const data = await resp.json();
        return { status: 'ok', count: data.count, unitPrice: data.unitPrice };
      } catch (e) {
        return { status: 'error' };
      }
    }

    // 切替・QR引き継ぎで共通利用する認証処理。成功したパスワードは次回オフライン時のためローカルにも保存する
    async function authenticateTeam(name) {
      let result = await fetchTeamFromServer(name, '');
      if (result.status === 'forbidden') {
        const input = prompt(`集計「${name}」のパスワードを入力してください`);
        if (input === null) return null;
        result = await fetchTeamFromServer(name, hashPassword(input));
        if (result.status === 'forbidden') {
          alert('パスワードが違います');
          return null;
        }
        if (result.status === 'ok') {
          setTallyPassword(name, input);
        }
      }
      if (result.status === 'error') {
        alert('通信エラーが発生しました。電波状況をご確認ください');
        return null;
      }
      return result;
    }

    // --- アプリ初期化 ---
    (async function initApp() {
    migrateAndInitData();
    const urlState = restoreFromUrl();

    let names = getTallyNames();
    let activeName = getActiveName();

    // URL共有(QR引き継ぎ)から開かれた場合、切替時と同じくサーバーでパスワードを照合してから復元する
    if (urlState && urlState.name) {
      const auth = await authenticateTeam(urlState.name);
      if (auth !== null) {
        activeName = urlState.name;
        if (!names.includes(activeName)) {
          names.push(activeName);
          setTallyNames(names);
        }

        const currentState = getTallyState(activeName);
        const baseCount = (auth.status === 'ok') ? auth.count : currentState.count;
        const baseUnitPrice = (auth.status === 'ok') ? auth.unitPrice : currentState.unitPrice;
        const updatedCount = (urlState.count !== null) ? urlState.count : baseCount;
        const updatedUnitPrice = (urlState.unitPrice !== null) ? urlState.unitPrice : baseUnitPrice;

        setTallyState(activeName, { count: updatedCount, unitPrice: updatedUnitPrice });
        setActiveName(activeName);
      }
    }

    // アクティブな状態の読み込み
    let activeState = getTallyState(activeName);
    let count = activeState.count;
    let unitPrice = activeState.unitPrice;

    // --- DOM要素の参照 ---
    const tallyNameDisplayEl = document.getElementById('tallyNameDisplay');
    const btnOpenSwitchModal = document.getElementById('btnOpenSwitchModal');
    const countValEl = document.getElementById('countVal');
    const priceInputEl = document.getElementById('priceInput');
    const totalAmountEl = document.getElementById('totalAmount');
    const btnPlus = document.getElementById('btnPlus');
    const btnMinus = document.getElementById('btnMinus');
    const btnReset = document.getElementById('btnReset');
    const btnShare = document.getElementById('btnShare');
    const btnSync = document.getElementById('btnSync');

    const switchModalEl = document.getElementById('switchModal');
    const btnCloseSwitchModal = document.getElementById('btnCloseSwitchModal');
    const tallyListEl = document.getElementById('tallyList');
    const newTallyInputEl = document.getElementById('newTallyInput');
    const newTallyPasswordInputEl = document.getElementById('newTallyPasswordInput');
    const btnCreateTally = document.getElementById('btnCreateTally');

    const shareModalEl = document.getElementById('shareModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const shareUrlInputEl = document.getElementById('shareUrlInput');
    const qrCanvasEl = document.getElementById('qrCanvas');
    const btnCopy = document.getElementById('btnCopy');
    const toastMsgEl = document.getElementById('toastMsg');

    priceInputEl.value = unitPrice;

    // 表示更新関数
    function updateDisplay() {
      tallyNameDisplayEl.textContent = activeName;
      countValEl.textContent = count;
      const total = count * unitPrice;
      totalAmountEl.textContent = total.toLocaleString('ja-JP') + ' 円';
      setTallyState(activeName, { count, unitPrice });
    }

    // --- ボタンイベントハンドラ ---
    btnPlus.addEventListener('click', () => {
      count++;
      updateDisplay();
    });

    btnMinus.addEventListener('click', () => {
      if (count > 0) {
        count--;
        updateDisplay();
      }
    });

    btnReset.addEventListener('click', () => {
      if (confirm(`集計「${activeName}」のカウントをリセットしますか？`)) {
        count = 0;
        updateDisplay();
      }
    });

    priceInputEl.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      unitPrice = isNaN(val) || val < 0 ? 0 : val;
      updateDisplay();
    });

    // --- 集計切替・作成機能 ---
    function renderTallyList(teams) {
      tallyListEl.innerHTML = '';
      teams.forEach(({ name, hasPassword }) => {
        const item = document.createElement('div');
        item.className = 'tally-item' + (name === activeName ? ' active' : '');

        const nameSpan = document.createElement('span');
        nameSpan.className = 'tally-item-name';
        nameSpan.textContent = name;
        nameSpan.addEventListener('click', () => switchTallyWithAuth(name));
        item.appendChild(nameSpan);

        if (!hasPassword) {
          const setPasswordBtn = document.createElement('button');
          setPasswordBtn.type = 'button';
          setPasswordBtn.className = 'tally-delete-btn';
          setPasswordBtn.textContent = 'パスワード設定';
          setPasswordBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setPasswordForTally(name);
          });
          item.appendChild(setPasswordBtn);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'tally-delete-btn';
        deleteBtn.textContent = '削除';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteTallyWithAuth(name);
        });
        item.appendChild(deleteBtn);

        tallyListEl.appendChild(item);
      });
    }

    // パスワード未設定の集計(デフォルトなど)に後からパスワードを付与する
    function setPasswordForTally(name) {
      const newPassword = prompt(`集計「${name}」に設定するパスワードを入力してください`);
      if (newPassword === null) return;
      if (!newPassword) {
        alert('パスワードを設定してください');
        return;
      }
      setTallyPassword(name, newPassword);
      openSwitchModal();
    }

    // サーバー(DB)の全チーム一覧とこの端末が知っているチーム名をあわせて表示する
    async function openSwitchModal() {
      let serverTeams = [];
      try {
        const resp = await fetch('/api/sync?list=1');
        if (resp.ok) {
          const data = await resp.json();
          serverTeams = data.teams || [];
        }
      } catch (e) {
        // オフライン時はサーバー一覧を諦め、この端末が知っている集計だけ表示する
      }
      const serverNames = new Set(serverTeams.map(t => t.name));
      // サーバーにまだ無いローカルのみの集計は、この端末のパスワード保存状況で補完する
      const localOnlyTeams = getTallyNames()
        .filter(name => !serverNames.has(name))
        .map(name => ({ name, hasPassword: !!getTallyPassword(name) }));
      const mergedTeams = [...serverTeams, ...localOnlyTeams];
      renderTallyList(mergedTeams);
      switchModalEl.style.display = 'flex';
    }

    // 削除はこの端末のローカル表示からのみ除外する(サーバー側のデータは消さない)
    async function deleteTallyWithAuth(targetName) {
      const auth = await authenticateTeam(targetName);
      if (auth === null) return;
      if (!confirm(`集計「${targetName}」を削除しますか？サーバーからも削除され、他の端末からも見えなくなります。この操作は元に戻せません`)) return;

      const password = getTallyPassword(targetName);
      const passwordHash = password ? hashPassword(password) : '';
      try {
        const delResp = await fetch(`/api/sync?name=${encodeURIComponent(targetName)}&passwordHash=${encodeURIComponent(passwordHash)}`, { method: 'DELETE' });
        if (delResp.status === 403) {
          alert('サーバー側に保存されているパスワードと一致しません');
          return;
        }
        if (!delResp.ok) {
          alert('サーバーからの削除に失敗しました');
          return;
        }
      } catch (e) {
        alert('通信エラーが発生しました。電波状況をご確認ください');
        return;
      }

      const updatedNames = getTallyNames().filter(n => n !== targetName);
      setTallyNames(updatedNames.length ? updatedNames : ['デフォルト']);
      localStorage.removeItem(KEY_STATE_PREFIX + targetName);
      localStorage.removeItem(KEY_PASSWORD_PREFIX + targetName);

      if (activeName === targetName) {
        if (!updatedNames.length) {
          setTallyState('デフォルト', { count: 0, unitPrice: 100 });
        }
        switchTally(updatedNames[0] || 'デフォルト');
      } else {
        openSwitchModal();
      }
    }

    // サーバー(DB)でパスワードを照合してから切替を許可する
    async function switchTallyWithAuth(targetName) {
      const auth = await authenticateTeam(targetName);
      if (auth === null) {
        return;
      }
      const names = getTallyNames();
      if (!names.includes(targetName)) {
        names.push(targetName);
        setTallyNames(names);
      }
      if (auth.status === 'ok') {
        setTallyState(targetName, { count: auth.count, unitPrice: auth.unitPrice });
      }
      switchTally(targetName);
    }

    function switchTally(targetName) {
      activeName = targetName;
      setActiveName(activeName);
      const state = getTallyState(activeName);
      count = state.count;
      unitPrice = state.unitPrice;
      priceInputEl.value = unitPrice;
      updateDisplay();
      switchModalEl.style.display = 'none';
    }

    btnOpenSwitchModal.addEventListener('click', () => {
      newTallyInputEl.value = '';
      newTallyPasswordInputEl.value = '';
      openSwitchModal();
    });

    btnCloseSwitchModal.addEventListener('click', () => {
      switchModalEl.style.display = 'none';
    });

    switchModalEl.addEventListener('click', (e) => {
      if (e.target === switchModalEl) switchModalEl.style.display = 'none';
    });

    btnCreateTally.addEventListener('click', async () => {
      const newName = newTallyInputEl.value.trim();
      if (!newName) return;

      // サーバー上に同名チームが既に存在する場合は、新規作成ではなくパスワード照合で合流させる
      const existsResult = await fetchTeamFromServer(newName, '');
      if (existsResult.status === 'ok' || existsResult.status === 'forbidden') {
        await switchTallyWithAuth(newName);
        return;
      }
      if (existsResult.status === 'error') {
        alert('通信エラーが発生しました。電波状況をご確認ください');
        return;
      }

      const newPassword = newTallyPasswordInputEl.value;
      if (!newPassword) {
        alert('パスワードを設定してください');
        return;
      }
      const passwordHash = hashPassword(newPassword);
      const postResp = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: newName, count: 0, unitPrice: 100, passwordHash }),
      }).catch(() => null);
      if (!postResp || !postResp.ok) {
        alert('サーバーへの登録に失敗しました。電波状況をご確認ください');
        return;
      }

      const currentNames = getTallyNames();
      if (!currentNames.includes(newName)) {
        currentNames.push(newName);
        setTallyNames(currentNames);
      }
      setTallyState(newName, { count: 0, unitPrice: 100 });
      setTallyPassword(newName, newPassword);
      switchTally(newName);
    });

    // --- 共有機能 (QRコード・コピー) ---
    btnShare.addEventListener('click', () => {
      // パスワードの照合はサーバー(DB)側で行うため、URLには名前とカウントのみ含める
      const shareUrl = `${window.location.origin}${window.location.pathname}?n=${encodeURIComponent(activeName)}&c=${count}&p=${unitPrice}`;
      shareUrlInputEl.value = shareUrl;
      QRCodeGenerator.draw(shareUrl, qrCanvasEl, 5);
      shareModalEl.style.display = 'flex';
    });

    btnCloseModal.addEventListener('click', () => {
      shareModalEl.style.display = 'none';
      toastMsgEl.style.display = 'none';
    });

    // サーバー(Vercel KV)との同期: 端末を交代するときに手動で押してもらう想定
    const syncModalEl = document.getElementById('syncModal');
    const btnCloseSyncModal = document.getElementById('btnCloseSyncModal');
    const syncTallyNameEl = document.getElementById('syncTallyName');
    const syncServerCountEl = document.getElementById('syncServerCount');
    const syncServerPriceEl = document.getElementById('syncServerPrice');
    const btnSyncPull = document.getElementById('btnSyncPull');
    const btnSyncPush = document.getElementById('btnSyncPush');
    let pendingSync = null;

    async function pushToServer(passwordHash) {
      const postResp = await fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: activeName, count, unitPrice, passwordHash }),
      });
      if (postResp.status === 403) {
        alert('サーバー側に保存されているパスワードと一致しません');
        return false;
      }
      if (!postResp.ok) {
        alert('サーバーへの送信に失敗しました');
        return false;
      }
      return true;
    }

    btnSyncPull.addEventListener('click', () => {
      if (!pendingSync) return;
      count = pendingSync.serverRecord.count;
      unitPrice = pendingSync.serverRecord.unitPrice;
      priceInputEl.value = unitPrice;
      updateDisplay();
      syncModalEl.style.display = 'none';
      alert('サーバーの内容を取り込みました');
      pendingSync = null;
    });

    btnSyncPush.addEventListener('click', async () => {
      if (!pendingSync) return;
      const ok = await pushToServer(pendingSync.passwordHash);
      syncModalEl.style.display = 'none';
      pendingSync = null;
      if (ok) alert('サーバーへ送信しました');
    });

    btnCloseSyncModal.addEventListener('click', () => {
      syncModalEl.style.display = 'none';
      pendingSync = null;
    });

    syncModalEl.addEventListener('click', (e) => {
      if (e.target === syncModalEl) {
        syncModalEl.style.display = 'none';
        pendingSync = null;
      }
    });

    btnSync.addEventListener('click', async () => {
      const password = getTallyPassword(activeName);
      const passwordHash = password ? hashPassword(password) : '';

      btnSync.disabled = true;
      try {
        const getResp = await fetch(`/api/sync?name=${encodeURIComponent(activeName)}&passwordHash=${encodeURIComponent(passwordHash)}`);

        if (getResp.status === 403) {
          alert('サーバー側に保存されているパスワードと一致しません');
          return;
        }

        if (getResp.ok) {
          const serverRecord = await getResp.json();
          pendingSync = { serverRecord, passwordHash };
          syncTallyNameEl.textContent = activeName;
          syncServerCountEl.textContent = serverRecord.count;
          syncServerPriceEl.textContent = serverRecord.unitPrice;
          syncModalEl.style.display = 'flex';
          return;
        }

        // サーバーに未登録(初回)の場合は選ぶまでもなく送信する
        const ok = await pushToServer(passwordHash);
        if (ok) alert('サーバーへ送信しました');
      } catch (e) {
        alert('通信エラーが発生しました。電波状況をご確認ください');
      } finally {
        btnSync.disabled = false;
      }
    });

    shareModalEl.addEventListener('click', (e) => {
      if (e.target === shareModalEl) {
        shareModalEl.style.display = 'none';
        toastMsgEl.style.display = 'none';
      }
    });

    btnCopy.addEventListener('click', () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrlInputEl.value).then(showToast).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    });

    function fallbackCopy() {
      shareUrlInputEl.select();
      document.execCommand('copy');
      showToast();
    }

    function showToast() {
      toastMsgEl.style.display = 'block';
      setTimeout(() => { toastMsgEl.style.display = 'none'; }, 2000);
    }

    // 初回描画
    updateDisplay();
    })();
  </script>
</body>
</html>
